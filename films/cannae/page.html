<script>

  btn("▶ Play the battle", "play", () => { chips.forEach((c) => c.classList.remove("on")); cur = 0; const last = CANNAE.phases.length - 1; run({ view: "battle", from: 0, to: last, labels }, 38, () => { cur = last; chips[last].classList.add("on"); }); });

  let era = 218;
  const ERAS = [[264, "264 BC"], [241, "241 BC"], [218, "218 BC"], [215, "215 BC"], [206, "206 BC"], [202, "202 BC"]];
  const eraBtns = ERAS.map(([e, l]) => btn(l, e === era ? "on" : "", () => { run({ view: "campaign", route: [cur, cur], geo, era: [era, e], cities: ["Rome", "Carthage", "Capua", ...(e === 202 ? ["Zama"] : [])], head: false }, 2.4); era = e; eraBtns.forEach((b, i) => b.classList.toggle("on", ERAS[i][0] === e)); }));
  btn("▶ Play the march", "play", () => { r.value = CANNAE.route.length - 1; run({ view: "campaign", route: [0, CANNAE.route.length - 1], geo, era: [era, era], cities: ["Rome", "Carthage", "Capua"] }, 22); cur = CANNAE.route.length - 1; });
  ui.appendChild(r);
  r.oninput = () => { const k = +r.value; run({ view: "campaign", route: [cur, k], geo, era: [era, era], cities: ["Rome", "Carthage", "Capua"] }, Math.max(1.2, 1.1 * Math.abs(k - cur))); cur = k; };
  run({ view: "campaign", route: [0, 0], geo, era: [era, era], cities: ["Rome", "Carthage", "Capua"] }, 0.01);
}

}

document.querySelectorAll("#tabs button").forEach((b) => b.onclick = () => {
  cancelAnimationFrame(anim);
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
  initMode(b.dataset.m);
});
initMode("battle");
</script></body>
